<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로스트아크 파티 빌더</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f5f6fa; --surface:#fff; --surface2:#f0f2f8;
  --border:#e2e5f0; --border2:#c8ccdd;
  --text:#1a1d2e; --text2:#5a607a; --text3:#9298b0;
  --accent:#378ADD; --accent2:#185FA5;
  --teal:#0F6E56; --teal-bg:#E1F5EE; --teal-border:#9FE1CB;
  --amber:#854F0B; --amber-bg:#FAEEDA;
  --red:#A32D2D; --red-bg:#FCEBEB;
  --green:#3B6D11; --green-bg:#EAF3DE;
  --sup-bg:#E1F5EE; --sup-border:#9FE1CB;
  --radius:10px; --radius-sm:6px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px 16px 60px;}
.container{max-width:1100px;margin:0 auto;}
h1{font-size:20px;font-weight:700;margin-bottom:4px;}
.subtitle{font-size:12px;color:var(--text3);margin-bottom:20px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.section-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.row:last-child{margin-bottom:0;}
input[type=text],select{height:36px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-family:inherit;font-size:13px;padding:0 12px;outline:none;transition:border-color .15s;}
input[type=text]{flex:1;min-width:180px;}
input[type=text]:focus,select:focus{border-color:var(--accent);}
select{min-width:140px;cursor:pointer;}
.btn{height:36px;padding:0 16px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn:hover{background:var(--surface2);color:var(--text);}
.btn-primary{background:var(--accent);border-color:var(--accent2);color:#fff;}
.btn-primary:hover{background:var(--accent2);}
.btn-sm{height:26px;padding:0 10px;font-size:11px;border-radius:4px;}
.status-box{font-size:12px;padding:8px 12px;border-radius:var(--radius-sm);margin-top:10px;display:none;}
.status-ok{background:var(--teal-bg);border:1px solid var(--teal-border);color:var(--teal);}
.status-err{background:var(--red-bg);border:1px solid #F09595;color:var(--red);}
.status-load{background:var(--surface2);border:1px solid var(--border);color:var(--text2);}
.member-grid{display:flex;flex-wrap:wrap;gap:6px;}
.time-section{margin-top:14px;}
.time-grid{display:flex;flex-wrap:wrap;gap:10px;}
.time-item{display:flex;flex-direction:column;gap:4px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;min-width:110px;}
.time-item-name{font-size:12px;font-weight:600;color:var(--text);}
.time-select{height:28px;font-size:11px;border-radius:4px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);padding:0 6px;font-family:inherit;cursor:pointer;}
.badge-time{background:var(--amber-bg);color:var(--amber);border:1px solid #FAC775;}
.member-chip{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;border:1px solid var(--border2);cursor:pointer;font-size:12px;background:var(--surface2);color:var(--text2);user-select:none;transition:all .12s;}
.member-chip.active{background:#E6F1FB;border-color:#85B7EB;color:#0C447C;}
.member-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--border2);flex-shrink:0;}
.member-chip.active .dot{background:var(--accent);}
.minbp-wrap{display:inline-flex;align-items:center;gap:6px;padding:0 10px;height:36px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);}
.minbp-wrap label{font-size:11px;color:var(--text3);white-space:nowrap;}
.minbp-wrap input{width:90px;height:26px;flex:none;min-width:0;padding:0 8px;font-size:12px;text-align:right;border:1px solid var(--border2);border-radius:4px;background:var(--surface);color:var(--text);font-family:inherit;}
.minbp-wrap input:focus{border-color:var(--accent);outline:none;}
.badge-lowbp{background:var(--red-bg);color:var(--red);border:1px solid #F09595;}
.party-avg.avg-low{color:var(--red);font-weight:700;}
.level-req{font-size:11px;color:var(--text3);padding:4px 10px;background:var(--surface2);border-radius:4px;border:1px solid var(--border);}

/* 탭 */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:16px;}
.tab-btn{padding:8px 20px;font-size:13px;font-weight:500;color:var(--text3);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;transition:all .15s;font-family:inherit;}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-btn:hover{color:var(--text);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* 자동 추천 탭 */
.result-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.party-count{font-size:28px;font-weight:700;}
.party-count-sub{font-size:12px;color:var(--text3);margin-left:6px;}
.parties-wrap{display:flex;flex-direction:column;gap:10px;}
.party-block{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.05);}
.party-header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:var(--surface2);border-bottom:1px solid var(--border);}
.party-header-left{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.party-title{font-size:13px;font-weight:700;}
.party-avg{font-size:11px;color:var(--text3);}
.badge{display:inline-block;font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;}
.badge-sup{background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-border);}
.badge-short{background:#E6F1FB;color:#185FA5;border:1px solid #B5D4F4;}
.badge-bsam{background:var(--green-bg);color:var(--green);border:1px solid #C0DD97;}
.badge-warn{background:var(--amber-bg);color:var(--amber);border:1px solid #FAC775;}
.slot-grid{display:grid;grid-template-columns:repeat(4,1fr);}
.party-slot{padding:12px 14px;border-right:1px solid var(--border);background:var(--surface);min-height:90px;}
.party-slot:last-child{border-right:none;}
.party-slot.support-slot{background:var(--sup-bg);}
.slot-role{font-size:10px;font-weight:500;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;}
.slot-role.sup-role{color:var(--teal);}
.slot-name{font-size:13px;font-weight:700;}
.slot-cls{font-size:11px;color:var(--text2);margin-top:2px;}
.slot-bp{font-size:11px;color:var(--accent);font-weight:500;margin-top:2px;}
.empty-label{font-size:11px;color:var(--text3);margin-top:4px;}
.slot-sel{width:100%;margin-top:8px;height:26px;font-size:10px;padding:0 6px;border-radius:4px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-family:inherit;cursor:pointer;}
.slot-sel:focus{border-color:var(--accent);outline:none;}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0;}
.stat-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.stat-pill{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:12px;display:flex;gap:5px;align-items:baseline;}
.stat-name{color:var(--text2);font-size:11px;}
.stat-cur{font-weight:700;}
.stat-max{font-size:11px;color:var(--text3);}
.stat-full{color:var(--teal)!important;}
.diff-normal{color:var(--text);}
.diff-hard{color:#e05c5c;}
.diff-nightmare{color:#9b6dff;}

/* 프리셋 */
.preset-section{margin-top:4px;}
.preset-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
.preset-list{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
.preset-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);gap:8px;}
.preset-item-left{display:flex;flex-direction:column;gap:2px;min-width:0;}
.preset-item-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.preset-item-meta{font-size:11px;color:var(--text3);}
.preset-item-btns{display:flex;gap:6px;flex-shrink:0;}
.preset-empty{font-size:12px;color:var(--text3);padding:8px 0;}
.preset-status{font-size:11px;padding:4px 8px;border-radius:4px;}
.preset-status-ok{color:var(--teal);background:var(--teal-bg);}
.preset-status-err{color:var(--red);background:var(--red-bg);}

/* 칸반 탭 */
.kanban-wrap{display:flex;gap:16px;align-items:flex-start;}
.pool-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;width:180px;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.pool-title{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.pool-list{display:flex;flex-direction:column;gap:6px;min-height:60px;border-radius:var(--radius-sm);padding:4px;transition:all .12s;}
.pool-list.drag-over{background:#E6F1FB;border:1.5px dashed var(--accent);}
.kanban-parties{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;}
.kanban-party{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.kanban-party-header{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:var(--surface2);border-bottom:1px solid var(--border);}
.kanban-party-title{font-size:12px;font-weight:700;}
.kanban-party-avg{font-size:11px;color:var(--text3);}
.kanban-slots{display:flex;gap:8px;padding:10px 12px;flex-wrap:wrap;}
.char-card{display:flex;flex-direction:column;gap:2px;padding:8px 10px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-sm);cursor:grab;user-select:none;transition:border-color .12s,box-shadow .12s;width:120px;flex-shrink:0;}
.char-card:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(55,138,221,.15);}
.char-card.dragging{opacity:.35;cursor:grabbing;}
.char-card.support-card{background:var(--sup-bg);border-color:var(--teal-border);}
.cc-member{font-size:12px;font-weight:700;color:var(--text);}
.cc-cls{font-size:11px;color:var(--text2);}
.cc-bp{font-size:11px;color:var(--accent);font-weight:500;}
.kanban-slot{width:120px;flex-shrink:0;min-height:76px;border:1.5px dashed var(--border2);border-radius:var(--radius-sm);display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;padding:5px 6px;transition:all .12s;position:relative;}
.kanban-slot.has-card{border-style:solid;border-color:var(--border);padding:0;}
.kanban-slot.drag-over{border-color:var(--accent);background:#E6F1FB;}
.kanban-slot.sup-slot{border-color:var(--teal-border);}
.kanban-slot.sup-slot.drag-over{background:var(--sup-bg);}
.slot-tag{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;padding:5px 8px 0;}
.kanban-add-btn{width:100%;height:34px;border:1.5px dashed var(--border2);border-radius:var(--radius-sm);background:none;color:var(--text3);font-size:12px;cursor:pointer;transition:all .12s;font-family:inherit;}
.kanban-add-btn:hover{border-color:var(--accent);color:var(--accent);}
.kanban-del-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;padding:0 2px;line-height:1;}
.kanban-del-btn:hover{color:var(--red);}

@media(max-width:700px){
  .kanban-wrap{flex-direction:column;}
  .pool-panel{width:100%;}
  .slot-grid{grid-template-columns:repeat(2,1fr);}
}

/* 완료 기록 */
.completed-bar { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.week-label { font-size:11px; color:var(--text3); padding:3px 8px; background:var(--surface2); border:1px solid var(--border); border-radius:4px; }
.char-card.done { opacity:.38; filter:grayscale(60%); position:relative; }
.char-card.done::after { content:'완료'; position:absolute; top:4px; right:4px; font-size:9px; font-weight:700; color:var(--teal); background:var(--teal-bg); border-radius:3px; padding:1px 4px; }
.done-badge { font-size:9px; font-weight:700; color:var(--teal); background:var(--teal-bg); border-radius:3px; padding:1px 5px; margin-left:4px; vertical-align:middle; }
.party-slot.done-slot { opacity:.45; }
.slot-done-tag { font-size:9px; font-weight:700; color:var(--teal); margin-top:2px; }
.complete-btn { height:22px; padding:0 8px; font-size:10px; border-radius:4px; border:1px solid var(--teal-border); background:var(--teal-bg); color:var(--teal); cursor:pointer; font-family:inherit; font-weight:500; white-space:nowrap; transition:all .12s; }
.complete-btn:hover { background:var(--teal); color:#fff; }
.complete-btn.undo { border-color:#F09595; background:var(--red-bg); color:var(--red); }
.complete-btn.undo:hover { background:var(--red); color:#fff; }

.party-block.dragging-party { opacity:.4; }
.party-block.drag-over-party { border-color:var(--accent); background:#EBF4FF; }
.kanban-party.dragging-party { opacity:.4; }
.kanban-party.drag-over-party { border-color:var(--accent); }
.drag-handle { cursor:grab; color:var(--text3); padding:0 6px; font-size:16px; user-select:none; }
.drag-handle:hover { color:var(--accent); }
.export-box { margin-top:12px; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; font-size:12px; color:var(--text2); line-height:1.8; white-space:pre-wrap; word-break:break-all; display:none; }
.export-row { display:flex; gap:8px; align-items:center; margin-top:10px; }

/* 미배치 캐릭터 표 */
.un-table { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
.un-table th { text-align:left; font-size:10px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; padding:6px 10px; border-bottom:1px solid var(--border2); white-space:nowrap; }
.un-table td { padding:6px 10px; border-bottom:1px solid var(--border); }
.un-table tr:last-child td { border-bottom:none; }
.un-table .un-bp { color:var(--accent); font-weight:500; text-align:right; white-space:nowrap; }
.un-table .un-ilvl { color:var(--text2); text-align:right; white-space:nowrap; }
.un-table .un-member { font-weight:700; white-space:nowrap; }
.un-table tr.un-sup td { background:var(--sup-bg); }
.un-role { font-size:10px; font-weight:700; padding:1px 6px; border-radius:3px; white-space:nowrap; }
.un-role.sup { color:var(--teal); background:var(--teal-bg); border:1px solid var(--teal-border); }
.un-role.deal { color:var(--text2); background:var(--surface2); border:1px solid var(--border); }
.un-empty { font-size:12px; color:var(--text3); padding:8px 0; }
.un-scroll { overflow-x:auto; }

/* 8인 레이드 세트(공대) 구분 */
.set-head { display:flex; align-items:center; gap:8px; margin:6px 0 2px; }
.set-head:first-child { margin-top:0; }
.set-head-line { flex:1; border-top:1px solid var(--border); }
.set-head-name { font-size:10px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:.08em; white-space:nowrap; }
.set-head-warn { font-size:10px; font-weight:700; color:var(--amber); background:var(--amber-bg); border:1px solid #FAC775; border-radius:4px; padding:1px 6px; white-space:nowrap; }
.set-head-ok { font-size:10px; font-weight:700; color:var(--teal); background:var(--teal-bg); border:1px solid var(--teal-border); border-radius:4px; padding:1px 6px; white-space:nowrap; }
</style>
</head>
<body>
<div class="container">
  <h1>로스트아크 파티 빌더</h1>
  <p class="subtitle">구글 시트 연동 · 전투력 기준 자동 조합 <span id="appVersion" style="font-size:11px;color:var(--border2);margin-left:4px;"></span></p>

  <div class="card">
    <div class="section-label">구글 시트 연동</div>
    <div class="row">
      <input type="text" id="sheetUrl" placeholder="Apps Script 웹 앱 URL"
        value="https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnQGLGC2OM2KlzGDVOzslsAu0QObE8uXCV55JmLWi5HDd_9ig4Kbm6MqtuaQlK2TcmfYjGSYFK1NAari5Uk2au8l7erxtNhTgT3ntNjQm5lMh54x2NZ7JBngxozCZBL64xqpYuWSiD--TcXHDRrJ_BGJKmwhTeoOEOaKOfB99iw3VA8WczPyGahtYg5fxgFlDNTkw3o97x83kQlAqx6DYAHVQB00hEcsOrNfBhXaHYOfBg4n8FuXOllTEHigN2Ll3WZFogw99YrUq-RRiNtkxYNWr6rjhQ&amp;lib=MHCntlx628YFMzZWHdMexP-uQqv0JC1lu"/>
      <button class="btn btn-primary" onclick="loadSheet()">불러오기</button>
    </div>
    <div id="statusBox" class="status-box"></div>
  </div>

  <div id="raidCard" class="card" style="display:none;">
    <div class="section-label">레이드 선택</div>
    <div class="row">
      <select id="raidSel" onchange="onRaidChange()">
        <option value="">-- 레이드 --</option>
        <option value="성심당">성심당</option>
        <option value="세르카">세르카</option>
        <option value="벨가르딘">벨가르딘</option>
      </select>
      <select id="diffSel" onchange="onDiffChange()">
        <option value="">-- 난이도 --</option>
      </select>
      <span id="levelReq" class="level-req" style="display:none;"></span>
      <span id="minBpWrap" class="minbp-wrap" style="display:none;">
        <label for="minBpInput">최소 평균 전투력</label>
        <input type="text" id="minBpInput" inputmode="numeric" placeholder="미설정"
          onchange="onMinBpChange()" title="이 레이드·난이도에서 파티 평균 전투력이 이 값 이상이 되도록 편성합니다. 비워두면 사용하지 않습니다."/>
      </span>
    </div>
    <div class="section-label">참여 멤버</div>
    <div class="member-grid" id="memberGrid"></div>
    <div class="time-section">
      <div class="section-label">접속 가능 시간</div>
      <div class="time-grid" id="timeGrid"></div>
    </div>
  </div>


  <div class="card" id="completedCard" style="display:none;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div class="section-label" style="margin-bottom:0;">이번 주 완료 현황 — <span id="completedRaidLabel" style="text-transform:none;font-size:11px;color:var(--text2);"></span></div>
      <div style="display:flex;gap:8px;align-items:center;">
        <span id="weekLabel" class="week-label"></span>
        <button class="btn btn-sm" onclick="resetWeek()" style="color:var(--red);border-color:#F09595;">주간 초기화</button>
      </div>
    </div>
    <div id="completedList" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
  </div>
  <div class="card preset-section" id="presetCard" style="display:none;">
    <div class="section-label">프리셋</div>
    <div class="preset-row">
      <button class="btn btn-primary" onclick="savePreset()">현재 구성 저장</button>
      <button class="btn" onclick="loadPresets()">저장된 프리셋 불러오기 ↺</button>
      <span id="presetStatus" class="preset-status" style="display:none;"></span>
    </div>
    <div class="preset-list" id="presetList"></div>
  </div>

  <div id="mainTabs" style="display:none;">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('recommend')">자동 추천</button>
      <button class="tab-btn" onclick="switchTab('kanban')">칸반 편집</button>
    </div>

    <!-- 자동 추천 탭 -->
    <div id="tab-recommend" class="tab-panel active">
      <div class="result-header">
        <div>
          <span class="party-count" id="partyCountLabel">0</span>
          <span class="party-count-sub">파티 구성</span>
        </div>

};
// 8인 레이드 = 4인 파티 2개가 한 공격대로 동시 입장.
// 인원이 모자라도 파티를 흩어놓지 않고 항상 공격대(2개 묶음) 단위로 구성한다.
const isEightManRaid=()=>currentDiff?.partySize===8;
// 정원(8인)을 못 채운 공격대의 파티 수 — 표시 구분에만 쓰인다
let partialPartyCount=0;
// 8인 레이드에서는 모든 파티가 공격대에 속한다
const isSetParty=pi=>isEightManRaid();
// 공격대 인덱스는 파티 순서에서 파생 (파티 2k, 2k+1이 한 공격대) → 삭제/순서변경에도 자동 유지
const setIdxOf=pi=>Math.floor(pi/2);
const setLabelOf=pi=>`${setIdxOf(pi)+1}공대 · 파티 ${pi%2+1}`;
// 해당 공격대가 8인을 채웠는지
function setIsComplete(pi){
  const base=setIdxOf(pi)*2;
  const a=allParties[base],b=allParties[base+1];
  if(!a||!b)return false;
  return filledCount(a)===4&&filledCount(b)===4;
}
// 해당 공격대의 현재 인원
function setFilledCount(pi){
  const base=setIdxOf(pi)*2;
  return filledCount(allParties[base]||[])+filledCount(allParties[base+1]||[]);
}
const SUPPORTS=["바드","홀나","도화가","발키리"];
const BSAM=["창술사","블레","슬레","데헌","리퍼"];

// 시너지 그룹 (같은 그룹 내 파티 중복 소프트 제한)
// 워로드처럼 두 그룹에 동시에 속하는 직업이 있으므로 항상 전체 소속을 확인한다
const SYNERGY_GROUPS=[
  {name:"방감12%",cls:["디트","워로드","블래","서머너","리퍼","환수사","차원술사"]},
  {name:"피증6%", cls:["버서커","슬레","인파","브커","호크","소서","데모닉","소울","가나"]},
  {name:"공증6%", cls:["기공","스카"]},
  {name:"치적10%",cls:["배마","스커","데헌","건슬","알카","기상"]},
  {name:"치피8%", cls:["창술사","발키리"]},
  {name:"백헤드9%",cls:["워로드","고기","블레"]},
];

// 캐릭터가 속한 시너지 그룹 인덱스 배열 (복수 소속 가능, 없으면 빈 배열)
function getSynergyGroups(cls,base){
  const b=base||cleanCls(cls);
  const out=[];
  SYNERGY_GROUPS.forEach((g,i)=>{if(g.cls.includes(b))out.push(i);});
  return out;
}
// 하위 호환: 대표 그룹 하나만 필요한 곳
function getSynergyGroup(cls,base){
  const g=getSynergyGroups(cls,base);
  return g.length?g[0]:-1;
}

// 파티에 같은 시너지 그룹 캐릭터가 있는지 체크 (복수 소속 직업은 하나라도 겹치면 중복)
function hasSynergyCls(p, cls, base){
  const b=base||cleanCls(cls);
  const mine=getSynergyGroups(cls,b);
  if(!mine.length)return false;
  return p.slots.some(s=>{
    if(!s||s.baseCls===b)return false;
    return getSynergyGroups(s.cls,s.baseCls).some(g=>mine.includes(g));
  });
}
// 접속 시간은 파티 편성 조건에 쓰지 않는다.
// 누구와 같은 파티가 되는지는 시간과 무관하게 정하고,
// 시간은 완성된 파티를 "빨리 출발할 수 있는 순서"로 정렬/표시하는 데만 쓴다.
// 파티의 대표 시작 시간 = 가장 늦은 사람 기준 (다 모여야 시작하므로)
function partyStartRank(slots){
  const ranks=slots.filter(s=>s).map(s=>memberStartTime[s.member]).filter(Boolean).map(timeRank);
  return ranks.length?Math.max(...ranks):null;
}
function partyStartLabel(slots){
  const r=partyStartRank(slots);
  if(r===null)return "";
  return (TIME_OPTIONS.find(o=>timeRank(o.value)===r)||{}).label||"";
}
// 파티를 시작 시간 이른 순으로 정렬. 빈 파티는 맨 뒤로.
// 8인 레이드는 두 파티가 한 세트이므로 세트 단위로 옮긴다.
function sortPartiesByStartTime(parties){
  const keyOf=slots=>{
    const r=partyStartRank(slots);
    return r===null?Infinity:r; // 시간 정보가 없는(빈) 파티는 맨 뒤
  };
  const byTime=list=>list
    .map((slots,i)=>({slots,i,k:keyOf(slots)}))
    .sort((a,b)=>a.k-b.k||a.i-b.i) // 동률이면 원래 순서 유지 (안정 정렬)
    .map(x=>x.slots);
  if(!isEightManRaid())return byTime(parties);
  // 8인 레이드는 공격대(2개 묶음) 단위로 정렬 — 짝이 깨지면 안 된다.
  // 공격대의 시작 시간은 8명 중 가장 늦은 사람 기준
  const sets=[];
  for(let i=0;i<parties.length;i+=2)sets.push([parties[i],parties[i+1]]);
  return sets
    .map((pair,i)=>({pair,i,k:keyOf([...(pair[0]||[]),...(pair[1]||[])])}))
    .sort((a,b)=>a.k-b.k||a.i-b.i)
    .flatMap(x=>x.pair.filter(p=>p!==undefined));
}
const TEAM_A_SINGLE=["민트치킨","전복치킨"];
const TEAM_A_MULTI=["카페룽고","잼둘냥"];
const TEAM_B_SINGLE=["남제나","포지셔닝"];
const TEAM_B_MULTI=["아즈웬","신카"];

// 궁합 제한: [서포터 멤버, 딜러 멤버] — 해당 서포터가 있는 파티에 해당 멤버의 딜러를 붙이지 않는다
const SUP_DEALER_BANS=[["카페룽고","잼둘냥"]];
// 이 파티에 name 멤버의 딜러를 넣으면 금지 조합이 되는지
function bannedWithSupport(p,name){
  return SUP_DEALER_BANS.some(([sup,deal])=>
    deal===name && p.slots.some(s=>s&&s.member===sup&&isSupport(s.cls,s.baseCls)));
}
// 이 파티에 name 멤버의 서포터를 넣으면 금지 조합이 되는지
function bannedAsSupport(p,name){
  return SUP_DEALER_BANS.some(([sup,deal])=>
    sup===name && p.slots.some(s=>s&&s.member===deal&&!isSupport(s.cls,s.baseCls)));
}
// 완성된 슬롯 배열에 금지 조합이 있는지 (경고 배지용)
function bannedPairsIn(slots){
  const f=slots.filter(s=>s);
  return SUP_DEALER_BANS.filter(([sup,deal])=>
    f.some(s=>s.member===sup&&isSupport(s.cls,s.baseCls)) &&
    f.some(s=>s.member===deal&&!isSupport(s.cls,s.baseCls)));
}

let MEMBERS_RAW=[],MEMBER_ORDER=[],selectedMembers=new Set(),currentDiff=null;
let memberStartTime={}; // {memberName: "9"|"10"|"11"|"later"}
const TIME_OPTIONS=[{value:"9",label:"9시"},{value:"10",label:"10시"},{value:"11",label:"11시"},{value:"later",label:"그 이후"}];
// 접속 시간 설정은 브라우저에 저장해 새로고침해도 유지한다
const TIME_STORE_KEY="lostark_party_startTimes";

function timeRank(v){return {"9":0,"10":1,"11":2,"later":3}[v]??3;}

// ── 레이드별 최소 평균 전투력 ──
// 레이드·난이도마다 따로 저장한다. 값이 없으면(0) 이 조건은 쓰지 않는다.
let minBpByDiff={}; // {"세르카|하드": 85000}
const MINBP_STORE_KEY="lostark_party_minBp";
const diffKeyOf=d=>d?`${d.sheetKey}|${d.label}`:"";

  const n=Number(String(input.value).replace(/[^\d.\-]/g,""));

// 슬롯 배열이 편성 규칙을 지키는지 (교환 후 검증용)
function slotsValid(slots){
  const f=slots.filter(s=>s);
  if(f.length>4)return false;
  const ms=f.map(s=>s.member);
  if(new Set(ms).size!==ms.length)return false;                                  // 멤버 중복
  const cs=f.map(s=>s.baseCls||cleanCls(s.cls));
  if(new Set(cs).size!==cs.length)return false;                                  // 직업 중복
  if(f.filter(s=>isSupport(s.cls,s.baseCls)).length>1)return false;              // 서포터 1명
  if(bannedPairsIn(slots).length)return false;                                   // 궁합 금지 조합
  return true;
}
// 8인 레이드는 두 파티가 한 세트이므로 세트 전체에서 멤버가 겹치면 안 된다
function setMemberOk(list,i){
  if(!isEightManRaid())return true;
  const partner=i%2===0?i+1:i-1;
  if(!list[partner])return true;
  const ms=[...list[i],...list[partner]].filter(Boolean).map(s=>s.member);
  return new Set(ms).size===ms.length;
}
// 최소 평균 전투력 미달 파티 끌어올리기
// 미달 파티의 캐릭터를, 기준을 넘는 파티의 더 강한 캐릭터와 맞바꾼다.
// 서포터끼리/딜러끼리만 교환하고, 넘겨준 파티가 기준 아래로 떨어지는 교환은 하지 않는다.
function enforceMinAvgBp(parties,minBp){
  if(!minBp||parties.length<2)return parties;
  const avg=slots=>{const f=slots.filter(s=>s);return f.length?f.reduce((a,c)=>a+c.bp,0)/f.length:0;};
  let guard=0,improved=true;
  while(improved&&guard++<200){
    improved=false;
    const weakOrder=parties.map((p,i)=>({i,a:avg(p)}))
      .filter(x=>x.a>0&&x.a<minBp).sort((x,y)=>x.a-y.a);
    for(const {i:wi} of weakOrder){
      const weak=parties[wi];
      let best=null,bestGain=0;
      for(let j=0;j<parties.length;j++){
        if(j===wi)continue;
        const strong=parties[j];
        if(avg(strong)<=minBp)continue; // 여유 있는 파티에서만 데려온다
        for(let a=0;a<weak.length;a++){
          for(let b=0;b<strong.length;b++){
            const w=weak[a],s=strong[b];
            if(!w||!s||s.bp<=w.bp)continue;
            if(isSupport(w.cls,w.baseCls)!==isSupport(s.cls,s.baseCls))continue; // 역할 유지
            const nw=weak.slice();nw[a]=s;
            const ns=strong.slice();ns[b]=w;
            if(!slotsValid(nw)||!slotsValid(ns))continue;
            if(avg(ns)<minBp)continue; // 넘겨준 쪽이 미달되면 무의미
            const next=parties.slice();next[wi]=nw;next[j]=ns;
            if(!setMemberOk(next,wi)||!setMemberOk(next,j))continue;
            const gain=avg(nw)-avg(weak);
            if(gain>bestGain){bestGain=gain;best={j,nw,ns};}
          }
        }
      }
      if(best){parties[wi]=best.nw;parties[best.j]=best.ns;improved=true;break;}
    }
  }
  return parties;
}

// 읽기 전용 URL 판별.
// /macros/echo (googleusercontent) 형태는 시트 데이터를 그대로 돌려주는 스냅샷 링크라
// action 파라미터를 무시하고 POST도 받지 않는다(405). 완료 기록·프리셋은 쓸 수 없다.
function isReadOnlyUrl(url){
  const u=url||getUrl();
  return u.includes("script.googleusercontent.com")||u.includes("/macros/echo");
}

// 쓰기 요청(POST) 헬퍼.
// 읽기 전용 URL에서는 서버가 405로 거절하므로, 조용히 실패하는 대신 명확히 알린다.
function postAction(body){
  if(isReadOnlyUrl()){
    return Promise.reject(new Error("현재 URL은 읽기 전용입니다. 저장하려면 Apps Script 웹 앱(/exec) URL이 필요합니다."));
  }
  return fetch(getUrl(),{method:"POST",body:JSON.stringify(body)});
}

// JSONP GET 헬퍼 (GET 파라미터로 action 전달)
function jsonpGet(params, onSuccess, onError) {
  const url = getUrl();
  // 읽기 전용 URL이면 서버에 물어봐야 소용없다 — 빈 결과로 즉시 응답해 8초씩 기다리지 않게 한다
  if(isReadOnlyUrl(url)){ onSuccess([]); return; }
  const cbName = "__cb_" + Date.now() + "_" + Math.random().toString(36).slice(2);
  const script = document.createElement("script");
  // Apps Script 콜드 스타트가 길어 8초로는 부족하다
  const tid = setTimeout(()=>{ cleanup(); if(onError) onError(); }, 60000);
  function cleanup(){ clearTimeout(tid); delete window[cbName]; script.parentNode&&script.parentNode.removeChild(script); }
  window[cbName] = data=>{ cleanup(); onSuccess(data); };
  script.onerror = ()=>{ cleanup(); if(onError) onError(); };
  const qs = Object.entries(params).map(([k,v])=>k+"="+encodeURIComponent(v)).join("&");
  script.src = url + (url.includes("?")?"&":"?") + qs + "&callback=" + cbName;
  document.head.appendChild(script);
}

// ── 시트 로드 ──
// Apps Script는 콜드 스타트 때문에 응답에 30초 이상 걸리는 일이 잦다.
// 그래서 (1) 제한 시간을 넉넉히 두고 (2) 제한을 넘겨 도착한 응답도 버리지 않고 살린다.
const SHEET_LOAD_TIMEOUT=60000;   // 이 시간이 지나면 실패로 안내 (요청은 계속 유지)
const SHEET_LOAD_GIVEUP=180000;   // 이 시간까지도 안 오면 완전히 포기

let sheetLoadSeq=0; // 늦게 온 응답이 최신 요청을 덮어쓰지 않도록 하는 요청 일련번호

function loadSheet(){
  const url=document.getElementById("sheetUrl").value.trim();
  if(!url){showStatus("URL을 입력해주세요.","err");return;}
  const mySeq=++sheetLoadSeq;
  const t0=Date.now();
  let done=false;      // 데이터를 성공적으로 처리했는지
  let timedOut=false;  // 제한 시간을 넘겼는지 (넘겨도 요청은 계속 기다린다)

  // 경과 시간을 보여줘 멈춘 게 아님을 알린다
  const tick=setInterval(()=>{
    if(done||mySeq!==sheetLoadSeq)return clearInterval(tick);
    const s=Math.round((Date.now()-t0)/1000);
    if(!timedOut)showStatus(`데이터 불러오는 중... ${s}초 (구글 시트가 느릴 수 있습니다)`,"load");
  },1000);
  showStatus("데이터 불러오는 중...","load");

  const finish=()=>{done=true;clearInterval(tick);clearTimeout(warnTid);clearTimeout(giveupTid);};

  // 성공 처리 (JSONP·fetch 어느 쪽으로 오든 여기로 모인다)
  const onData=data=>{
    if(done||mySeq!==sheetLoadSeq)return; // 이미 처리했거나 더 새로운 요청이 있으면 무시
    finish();
    const s=((Date.now()-t0)/1000).toFixed(1);
    try{
      MEMBERS_RAW=parseSheetData(data);
      if(!MEMBERS_RAW.length)throw new Error("캐릭터 데이터를 찾을 수 없습니다.");
      MEMBER_ORDER=MEMBERS_RAW.map(m=>m.name);
      selectedMembers=new Set(MEMBER_ORDER);
      loadStartTimes(); // 이전에 설정한 접속 시간 복원
      loadMinBp();      // 이전에 설정한 최소 평균 전투력 복원
      const total=MEMBERS_RAW.reduce((s2,m)=>s2+m.chars.length,0);
      showStatus(`✓ ${MEMBERS_RAW.length}명 / 캐릭터 ${total}개 불러오기 완료 (${s}초)`,"ok");
      document.getElementById("raidCard").style.display="block";
      document.getElementById("mainTabs").style.display="none";
      renderMembers();
    }catch(e){showStatus("파싱 오류: "+e.message,"err");}
  };
  const onFail=msg=>{
    if(done||mySeq!==sheetLoadSeq)return;
    finish();
    showStatus("불러오기 실패: "+msg,"err");
  };

  // 제한 시간을 넘겨도 요청은 살려둔다 — 늦게라도 도착하면 onData가 처리한다
  const warnTid=setTimeout(()=>{
    if(done||mySeq!==sheetLoadSeq)return;
    timedOut=true;
    showStatus(`응답이 늦어지고 있습니다 (${Math.round(SHEET_LOAD_TIMEOUT/1000)}초 경과). 계속 기다리는 중...`,"load");
  },SHEET_LOAD_TIMEOUT);
  const giveupTid=setTimeout(()=>onFail("시간 초과 (3분)"),SHEET_LOAD_GIVEUP);

  // ── 요청 방식 결정 ──
  // /macros/echo 형태(googleusercontent)는 JSONP를 지원하지 않고 순수 JSON을 돌려준다.
  // 대신 CORS가 열려 있어 fetch로 받을 수 있다. 구형 /exec URL은 기존대로 JSONP를 쓴다.
  if(url.includes("script.googleusercontent.com")||url.includes("/macros/echo")){
    fetch(url)
      .then(r=>r.text())
      .then(txt=>{
        let data;
        try{data=JSON.parse(txt);}
        catch(e){
          // 구글이 에러 페이지(HTML)를 돌려준 경우
          throw new Error(/^\s*</.test(txt)
            ? "구글이 데이터 대신 오류 페이지를 반환했습니다. URL이 만료되었거나 접근 권한을 확인해주세요."
            : "응답을 해석할 수 없습니다.");
        }
        onData(data);
      })
      .catch(e=>onFail(e.message||"네트워크 오류"));
    return;
  }

  // 구형 /exec URL — JSONP
  const cbName="__gs_"+Date.now(),script=document.createElement("script");
  window[cbName]=data=>{
    delete window[cbName];
    script.parentNode&&script.parentNode.removeChild(script);
    onData(data);
  };
  script.onerror=()=>{
    delete window[cbName];
    script.parentNode&&script.parentNode.removeChild(script);
    onFail("스크립트 로드 오류");
  };
  script.src=url+(url.includes("?")?"&":"?")+"callback="+cbName;
  document.head.appendChild(script);
}
function showStatus(msg,type){
  const el=document.getElementById("statusBox");
  el.style.display="block";el.textContent=msg;el.className="status-box status-"+type;
}
function parseSheetData(rows){
  if(!rows||rows.length<2)return[];
  const SKIP=["직업","아이템 레벨","아이템레벨","전투력","세르카","성심당","벨가르딘",""];
  const isName=v=>{const s=String(v||"").trim();return s&&isNaN(s)&&!SKIP.includes(s);};
  const numCols=Math.max(...rows.map(r=>Array.isArray(r)?r.length:0));

  // 컬럼 간격 자동 감지: 헤더행에서 "직업"이 몇 칸 간격으로 반복되는지 확인
  const headerRow=rows[0]||[];
  let colStep=5; // 기본값
  for(let c=1;c<headerRow.length;c++){
    if(String(headerRow[c]||"").trim()==="직업"){colStep=c;break;}
  }

  let ni=-1;
  for(let r=1;r<Math.min(rows.length,5);r++){
    const vals=[];for(let gi=0;gi*colStep<=numCols;gi++)vals.push((rows[r]||[])[gi*colStep]);
    if(vals.some(isName)){ni=r;break;}
  }
  if(ni<0)return[];
  const members=[];
  for(let gi=0;gi*colStep<=numCols;gi++){
    const base=gi*colStep;
    const row=rows[ni]||[];
    const name=String(row[base]||"").trim();
    if(!name||!isName(name))continue;
    const chars=[];
    for(let r=0;r<rows.length;r++){
      if(r===ni)continue;
      const rr=rows[r]||[];
      const clsRaw=String(rr[base]||"").trim();
      if(!clsRaw||SKIP.includes(clsRaw)||clsRaw===name)continue;
      const ilvl=parseFloat(String(rr[base+1]||"").replace(/,/g,""));
      const bp=parseFloat(String(rr[base+2]||"").replace(/,/g,""));
      if(!ilvl||!bp)continue;
      const clsDisplay=rawCls(clsRaw);const clsBase=cleanCls(clsRaw);
      // 컬럼 인덱스: base+3=세르카, base+4=성심당, base+5=벨가르딘(있으면)
      chars.push({
        cls:clsDisplay,baseCls:clsBase,ilvl,bp,
        세르카:String(rr[base+3]||"").trim(),
        성심당:String(rr[base+4]||"").trim(),
        벨가르딘:colStep>=6?String(rr[base+5]||"").trim():""
      });
    }
    if(chars.length)members.push({name,chars});
  }
  return members;
}
function charFits(c){
  if(!currentDiff)return false;
  if(c.ilvl<currentDiff.minIlvl)return false;
  const val=String(c[currentDiff.sheetKey]||"").trim();
  return val===currentDiff.sheetVal;
}
function getEligibleChars(name){
  const m=MEMBERS_RAW.find(x=>x.name===name);
  if(!m)return[];
  // uid는 전체 캐릭터 배열 기준 인덱스로 고정 (레이드/난이도가 바뀌어도 uid 불변)
  return m.chars
    .map((c,i)=>({...c,member:name,uid:name+"_"+i}))
    .filter(c=>charFits(c))
    .filter(c=>!completedUids.has(c.uid))
    .map(c=>({...c,baseCls:c.baseCls||cleanCls(c.cls)}));
}

// ── 자동 추천 ──
const makeParty=()=>({slots:[],usedMember:new Set(),usedCls:new Set(),bsamCount:0});
function addSlot(p,ch,used){p.slots.push(ch);p.usedMember.add(ch.member);p.usedCls.add(ch.baseCls||cleanCls(ch.cls));if(isBsam(ch.cls,ch.baseCls))p.bsamCount++;used.add(ch.uid);}
// 딜러 먼저, 서포터는 항상 파티의 마지막 자리 (딜러1, 딜러2, 딜러3, 서포터)
function sortP(p){
  p.slots.sort((a,b)=>{
    const sa=isSupport(a.cls,a.baseCls)?1:0, sb=isSupport(b.cls,b.baseCls)?1:0;
    return sa-sb || memberOrderIdx(a.member)-memberOrderIdx(b.member);
  });
  while(p.slots.length<4)p.slots.push(null);
}
// 슬롯 배열을 딜러→서포터 순으로 재정렬 (빈 슬롯은 딜러 자리에 남김)
function orderSlots(slots){
  const filled=slots.filter(s=>s);
  const dealers=filled.filter(s=>!isSupport(s.cls,s.baseCls));
  const supports=filled.filter(s=>isSupport(s.cls,s.baseCls));
  const out=[...dealers];
  while(out.length<4-supports.length)out.push(null);
  return [...out,...supports].slice(0,Math.max(4,filled.length));
}
const partyAvgBp=slots=>{const f=slots.filter(s=>s);return f.length?f.reduce((s,c)=>s+c.bp,0)/f.length:0;};
const filledCount=slots=>slots.filter(s=>s).length;
function pickDealer(name,p,used,priority){
  // 금지 조합(카페룽고 서폿 + 잼둘냥 딜러)이면 배치하지 않음
  if(bannedWithSupport(p,name))return null;
  let chars=getEligibleChars(name).filter(c=>!used.has(c.uid)&&!isSupport(c.cls));
  if(!chars.length)return null;
  chars.sort((a,b)=>priority==="lowest"?a.bp-b.bp:b.bp-a.bp);
  // 우선순위: 1)직업중복X+시너지중복X+백사멸2이하  2)직업중복X+시너지중복X  3)직업중복X+백사멸2이하  4)직업중복X  5)백사멸3이하  6)무조건
  const bc=c=>c.baseCls||cleanCls(c.cls);
  // 직업 중복은 절대 조건 - usedCls에 없는 것만
  const noDupCls=chars.filter(c=>!p.usedCls.has(bc(c)));
  if(!noDupCls.length)return null; // 직업 중복 없이 배치 불가 시 null
  return noDupCls.find(c=>!hasSynergyCls(p,c.cls,bc(c))&&!(isBsam(c.cls,bc(c))&&p.bsamCount>=2))
    ||noDupCls.find(c=>!hasSynergyCls(p,c.cls,bc(c)))
    ||noDupCls.find(c=>!(isBsam(c.cls,bc(c))&&p.bsamCount>=2))
    ||noDupCls[0];
}
function tryAssignSupport(p,order,used){
  const cand=order.filter(n=>selectedMembers.has(n)&&MEMBER_ORDER.includes(n)&&!p.usedMember.has(n)
    &&!bannedAsSupport(p,n)&&getEligibleChars(n).some(c=>!used.has(c.uid)&&isSupport(c.cls)));
  if(!cand.length)return false;
  const name=cand[0];
  const ch=getEligibleChars(name).filter(c=>!used.has(c.uid)&&isSupport(c.cls)).sort((a,b)=>b.bp-a.bp)[0];
  addSlot(p,ch,used);return true;
}
function balanceParties(parties,freeFrom){
  let improved=true,iter=0;
  while(improved&&iter<200){
    improved=false;iter++;
    let maxPi=-1,minPi=-1,maxA=-Infinity,minA=Infinity;
    for(let i=freeFrom;i<parties.length;i++){const a=partyAvgBp(parties[i].slots);if(a>maxA){maxA=a;maxPi=i;}if(a>0&&a<minA){minA=a;minPi=i;}}
    if(maxPi<0||minPi<0||maxPi===minPi||maxA-minA<100)break;
    const hp=parties[maxPi],lp=parties[minPi];let best=null,bestGain=0;
    hp.slots.forEach((hs,hsi)=>{if(!hs||isSupport(hs.cls))return;lp.slots.forEach((ls,lsi)=>{if(!ls||isSupport(ls.cls))return;if(hs.member!==ls.member||hs.bp<=ls.bp)return;const hf=hp.slots.filter(s=>s),lf=lp.slots.filter(s=>s);const nha=(hf.reduce((s,c)=>s+c.bp,0)-hs.bp+ls.bp)/hf.length,nla=(lf.reduce((s,c)=>s+c.bp,0)-ls.bp+hs.bp)/lf.length,gain=(maxA-minA)-Math.abs(nha-nla);if(gain>bestGain){bestGain=gain;best={hsi,lsi,hs,ls};}});});
    if(best&&bestGain>0){hp.slots[best.hsi]=best.ls;lp.slots[best.lsi]=best.hs;improved=true;}
  }
}
// 8인 레이드 전용: 한 공격대 = 4인 파티 2개(각 서포터1+딜러3)가 동시 입장.
// 인원이 남으면 공격대를 반복 생성하고, 정원(8인)을 못 채우는 나머지도
// buildPartialRaids로 공격대 단위를 유지한 채 묶는다.
function buildVelgardinParties(used, mCnt){
  const rDQ={}, rSQ={};
  const activeMembers=()=>MEMBER_ORDER.filter(n=>selectedMembers.has(n));
  activeMembers().forEach(n=>{
    rDQ[n]=getEligibleChars(n).filter(c=>!used.has(c.uid)&&!isSupport(c.cls,c.baseCls)).sort((a,b)=>a.bp-b.bp);
    rSQ[n]=getEligibleChars(n).filter(c=>!used.has(c.uid)&&isSupport(c.cls,c.baseCls)).sort((a,b)=>b.bp-a.bp);
  });

  const result=[];
  // 세트 단위로 반복: 서포터 2명 + 딜러 6명이 남아 있는 동안 계속 생성
  while(true){
    // ── 서포터 2명 선발 (참여횟수 적은 멤버 → 전투력 높은 쪽) ──
    const suppCand=[];
    activeMembers().forEach(n=>{ rSQ[n].filter(c=>!used.has(c.uid)).forEach(c=>suppCand.push(c)); });
    suppCand.sort((a,b)=>{
      const d=(mCnt[a.member]||0)-(mCnt[b.member]||0);
      return d || b.bp-a.bp;
    });
    const suppPicked=[], suppUsedMembers=new Set();
    for(const c of suppCand){
      if(suppUsedMembers.has(c.member))continue;
      suppPicked.push(c);suppUsedMembers.add(c.member);
      if(suppPicked.length>=2)break;
    }
    // 서포터 2명을 못 채우면 8인 세트 성립 불가 → 남은 인원은 아래에서 4인 파티로 처리
    if(suppPicked.length<2)break;

    // ── 딜러 6명이 남아 있는지 확인 (서포터 2명의 멤버는 딜러로 중복 참여 불가) ──
    const remainDealers=activeMembers().filter(n=>!suppUsedMembers.has(n))
      .reduce((s,n)=>s+rDQ[n].filter(c=>!used.has(c.uid)).length,0);
    if(remainDealers<6)break;

    // ── 세트 구성 ──
    const p1=makeParty(), p2=makeParty();
    suppPicked.forEach((c,i)=>{
      const p=i===0?p1:p2;
      addSlot(p,c,used);
      rSQ[c.member]=rSQ[c.member].filter(x=>x.uid!==c.uid);
      mCnt[c.member]=(mCnt[c.member]||0)+1;
    });

    // 딜러를 각 파티에 3명씩 배분 (시너지/직업 중복 소프트 제한)
    // 같은 세트의 두 파티는 동시 입장하므로, 멤버 중복은 세트 전체에서 금지한다.
    const setMembers=new Set([...p1.usedMember,...p2.usedMember]);
    const fillDealers=(party)=>{
      while(party.slots.filter(s=>s).length<4){
        // 금지 조합(카페룽고 서폿 + 잼둘냥 딜러) 멤버는 후보에서 제외
        const cands=activeMembers().filter(n=>rDQ[n]&&rDQ[n].some(c=>!used.has(c.uid))&&!setMembers.has(n)
          &&!bannedWithSupport(party,n))
          .sort((a,b)=>{
            const d=(mCnt[a]||0)-(mCnt[b]||0);return d||memberOrderIdx(a)-memberOrderIdx(b);
          });
        if(!cands.length)break;
        let picked=null,pickedChar=null;
        const bc=c=>c.baseCls||cleanCls(c.cls);
        // 1순위: 직업중복X+시너지중복X+백사멸2이하
        outer1:for(const n of cands){for(const ch of rDQ[n]){if(used.has(ch.uid))continue;if(party.usedCls.has(bc(ch))||hasSynergyCls(party,ch.cls,bc(ch))||(isBsam(ch.cls,bc(ch))&&party.bsamCount>=2))continue;picked=n;pickedChar=ch;break outer1;}}
        // 2순위: 직업중복X+시너지중복X
        if(!picked){outer2:for(const n of cands){for(const ch of rDQ[n]){if(used.has(ch.uid))continue;if(party.usedCls.has(bc(ch))||hasSynergyCls(party,ch.cls,bc(ch)))continue;picked=n;pickedChar=ch;break outer2;}}}
        // 3순위: 직업중복X
        if(!picked){outer3:for(const n of cands){for(const ch of rDQ[n]){if(used.has(ch.uid))continue;if(party.usedCls.has(bc(ch)))continue;picked=n;pickedChar=ch;break outer3;}}}
        // 4순위: 무조건
        if(!picked){for(const n of cands){const ch=rDQ[n].find(c=>!used.has(c.uid));if(ch){picked=n;pickedChar=ch;break;}}}
        if(picked&&pickedChar){
          addSlot(party,pickedChar,used);
          setMembers.add(picked);
          rDQ[picked]=rDQ[picked].filter(c=>c.uid!==pickedChar.uid);
          mCnt[picked]=(mCnt[picked]||0)+1;
        } else break;
      }
    };
    fillDealers(p1);fillDealers(p2);
    sortP(p1);sortP(p2);

    // 8인이 모두 차지 않으면 세트 성립 불가 → 되돌리고 종료
    // (남은 인원은 아래 fallback에서 4인 파티로 묶는다)
    if(filledCount(p1.slots)<4||filledCount(p2.slots)<4){
      [...p1.slots,...p2.slots].filter(s=>s).forEach(s=>{
        used.delete(s.uid);
        mCnt[s.member]=Math.max(0,(mCnt[s.member]||1)-1);
      });
      break;
    }

    result.push(p1,p2);
  }

  // ── 8인 공대를 더 못 만드는 인원 처리 ──
  // 8인 레이드는 어디까지나 공격대(4인 파티 2개) 단위다.
  // 정원을 못 채우더라도 파티를 흩어놓지 않고 공격대 단위로 묶는다.
  const remaining=[];
  MEMBER_ORDER.filter(n=>selectedMembers.has(n)).forEach(n=>{
    getEligibleChars(n).forEach(c=>{ if(!used.has(c.uid))remaining.push(c); });
  });
  const paired=buildPartialRaids(remaining);
  paired.forEach(p=>p.slots.filter(s=>s).forEach(s=>{
    used.add(s.uid);mCnt[s.member]=(mCnt[s.member]||0)+1;
  }));

  balanceParties(result,0);
  // 정식 8인 공대를 먼저, 정원 미달 공격대는 뒤에 붙인다
  paired.forEach(p=>{p.isPartial=true;});
  return [...result,...paired];
}

// 정원을 못 채우는 인원을 공격대(4인 파티 2개) 단위로 묶는다.
// 파티를 먼저 만들고 짝을 찾으면 멤버가 겹쳐 짝을 못 짓는 경우가 많으므로,
// 처음부터 공격대 하나(최대 8명)를 통째로 채운 뒤 두 파티로 나눈다.
// 한 공격대 안에서는 같은 멤버가 두 번 들어갈 수 없다(동시 입장이므로).
function buildPartialRaids(chars){
  const out=[];
  let pool=[...chars];
  let guard=0;
  while(pool.length&&guard++<50){
    // ① 이번 공격대에 넣을 8명을 고른다 (한 공격대 안에서 멤버 중복 금지).
    // 남은 캐릭터가 적은 멤버부터 뽑아야, 캐릭터가 많은 멤버가 뒤쪽 공격대를 채울 수 있다.
    const byMember={};
    pool.forEach(c=>{(byMember[c.member]=byMember[c.member]||[]).push(c);});
    const order=Object.keys(byMember)
      .sort((a,b)=>byMember[a].length-byMember[b].length
        ||memberOrderIdx(a)-memberOrderIdx(b));
    const picked=[];
    order.forEach(m=>{
      if(picked.length>=8)return;
      // 각 멤버에서 전투력이 가장 높은 캐릭터 하나
      picked.push(byMember[m].slice().sort((a,b)=>b.bp-a.bp)[0]);
    });
    if(!picked.length)break;
    // 남은 인원이 파티 하나도 못 채울 만큼이면 중단 (1~2명짜리 공격대 난립 방지)
    if(picked.length<MIN_PARTY_SIZE&&out.length)break;
    const pickedSet=new Set(picked.map(c=>c.uid));
    pool=pool.filter(c=>!pickedSet.has(c.uid));

    // ② 두 파티로 나눈다 — 서포터를 한 명씩 갈라 넣고, 직업 중복을 피해 배분
    const p1=makeParty(),p2=makeParty();
    const sup=picked.filter(c=>isSupport(c.cls,c.baseCls));
    const deal=picked.filter(c=>!isSupport(c.cls,c.baseCls));
    if(sup[0])placeChar(p1,sup[0]);
    if(sup[1])placeChar(p2,sup[1]);
    // 남는 서포터는 딜러 취급해 빈 자리에 넣는다 (정원 미달일 땐 빈 칸보다 낫다)
    const rest=[...deal,...sup.slice(2)];
    rest.forEach(c=>{
      const b=c.baseCls||cleanCls(c.cls);
      const fits=p=>filledCount(p.slots)<4&&!p.slots.filter(s=>s).some(s=>(s.baseCls||cleanCls(s.cls))===b);
      // 인원이 적은 파티부터 채워 두 파티 인원을 맞춘다
      const cand=[p1,p2].filter(fits).sort((x,y)=>filledCount(x.slots)-filledCount(y.slots));
      const tgt=cand[0]||[p1,p2].filter(p=>filledCount(p.slots)<4)
        .sort((x,y)=>filledCount(x.slots)-filledCount(y.slots))[0];
      if(tgt)placeChar(tgt,c);
    });
    p1.slots=orderSlots(p1.slots);p2.slots=orderSlots(p2.slots);
    out.push(p1,p2); // 정원 미달이어도 항상 파티 2개(=공격대 1개)로 유지
  }
  // 남은 인원이 있으면(멤버 수 한계로 공격대에 못 들어간 캐릭터) 마지막 공격대의 빈 칸에 채운다
  if(pool.length&&out.length){
    pool.forEach(c=>{
      for(let b=out.length-2;b>=0;b-=2){
        const setMembers=new Set([...out[b].slots,...out[b+1].slots].filter(s=>s).map(s=>s.member));
        if(setMembers.has(c.member))continue; // 같은 공격대에 같은 멤버 불가
        const bcl=c.baseCls||cleanCls(c.cls);
        const tgt=[out[b],out[b+1]]
          .filter(p=>filledCount(p.slots)<4&&!p.slots.filter(s=>s).some(s=>(s.baseCls||cleanCls(s.cls))===bcl))
          .sort((x,y)=>filledCount(y.slots)-filledCount(x.slots))[0];
        if(tgt){placeChar(tgt,c);tgt.slots=orderSlots(tgt.slots);break;}
      }
    });
  }
  return out;
}

function buildFreeParties(used,mCnt){
  const rDQ={},rSQ={};
  MEMBER_ORDER.filter(n=>selectedMembers.has(n)).forEach(n=>{rDQ[n]=getEligibleChars(n).filter(c=>!used.has(c.uid)&&!isSupport(c.cls)).sort((a,b)=>a.bp-b.bp);rSQ[n]=getEligibleChars(n).filter(c=>!used.has(c.uid)&&isSupport(c.cls)).sort((a,b)=>b.bp-a.bp);});
  const parties=[];
  const hasRemain=()=>MEMBER_ORDER.some(n=>selectedMembers.has(n)&&((rDQ[n]?.length>0)||(rSQ[n]?.length>0)));
  while(hasRemain()){
    const ep=makeParty();
    // 서포터 선발: 참여횟수가 적은 멤버 우선 (시간은 편성에 관여하지 않는다)
    const supCand=MEMBER_ORDER.filter(n=>selectedMembers.has(n)&&!ep.usedMember.has(n)&&rSQ[n]?.length>0
      &&!bannedAsSupport(ep,n)).sort((a,b)=>{
      const d=(mCnt[a]||0)-(mCnt[b]||0);return d||memberOrderIdx(a)-memberOrderIdx(b);
    });
    if(supCand.length){const name=supCand[0];const ch=rSQ[name][0];addSlot(ep,ch,used);rSQ[name].shift();mCnt[name]=(mCnt[name]||0)+1;}
    while(ep.slots.filter(s=>s).length<4){
      // 금지 조합(카페룽고 서폿 + 잼둘냥 딜러) 멤버는 후보에서 제외
      const cands=MEMBER_ORDER.filter(n=>selectedMembers.has(n)&&rDQ[n]?.length>0&&!ep.usedMember.has(n)
        &&!bannedWithSupport(ep,n)).sort((a,b)=>{
        const d=(mCnt[a]||0)-(mCnt[b]||0);return d||memberOrderIdx(a)-memberOrderIdx(b);
      });
      if(!cands.length)break;
      let picked=null,pickedChar=null;
      // 1순위: 직업중복X + 시너지중복X + 백사멸2이하
      outer1:for(const n of cands){for(const ch of rDQ[n]){const b=ch.baseCls||cleanCls(ch.cls);if(ep.usedCls.has(b)||hasSynergyCls(ep,ch.cls,b)||(isBsam(ch.cls,b)&&ep.bsamCount>=2))continue;picked=n;pickedChar=ch;break outer1;}}
      // 2순위: 직업중복X + 시너지중복X
      if(!picked){outer1b:for(const n of cands){for(const ch of rDQ[n]){const b=ch.baseCls||cleanCls(ch.cls);if(ep.usedCls.has(b)||hasSynergyCls(ep,ch.cls,b))continue;picked=n;pickedChar=ch;break outer1b;}}}
      // 3순위: 직업중복X + 백사멸2이하
      if(!picked){outer1c:for(const n of cands){for(const ch of rDQ[n]){const b=ch.baseCls||cleanCls(ch.cls);if(ep.usedCls.has(b)||(isBsam(ch.cls,b)&&ep.bsamCount>=2))continue;picked=n;pickedChar=ch;break outer1c;}}}
      // 4순위: 직업중복X(절대)
      if(!picked){outer2:for(const n of cands){for(const ch of rDQ[n]){const b=ch.baseCls||cleanCls(ch.cls);if(ep.usedCls.has(b))continue;picked=n;pickedChar=ch;break outer2;}}}
      if(!picked){picked=cands[0];pickedChar=rDQ[picked][0];}
      if(picked&&pickedChar){addSlot(ep,pickedChar,used);rDQ[picked]=rDQ[picked].filter(c=>c.uid!==pickedChar.uid);mCnt[picked]=(mCnt[picked]||0)+1;}else break;
    }
    // 여기서는 인원이 적어도 일단 파티로 담아두고,
    // 최소 인원(MIN_PARTY_SIZE) 미달 정리는 consolidateParties 에서 한 번에 처리한다
    sortP(ep);
    if(filledCount(ep.slots)>0)parties.push(ep);
    else break; // 아무도 못 넣었으면 무한 루프 방지
  }
  return consolidateParties(parties);
}
// 미완성 파티 정리: 자투리 파티의 인원을 앞쪽 빈 칸으로 옮겨 4명 파티를 최대한 만든다.
// 그리디 배치는 파티 수를 미리 못 정해서 3명+1명 같은 결과가 나올 수 있다.
// 파티 최소 인원 — 이보다 적으면 파티로 내보내지 않는다
const MIN_PARTY_SIZE=3;
// 이 파티에 해당 캐릭터를 넣을 수 있는지 (빈 칸 / 멤버·직업 중복 / 서포터 1명 / 궁합 금지)
function canAcceptChar(p,ch){
  const f=p.slots.filter(s=>s);
  if(f.length>=4)return false;
  if(f.some(s=>s.member===ch.member))return false;               // 멤버 중복 금지
  const b=ch.baseCls||cleanCls(ch.cls);
  if(f.some(s=>(s.baseCls||cleanCls(s.cls))===b))return false;   // 직업 중복 금지
  if(isSupport(ch.cls,ch.baseCls)&&f.some(s=>isSupport(s.cls,s.baseCls)))return false; // 서포터는 1명
  if(bannedWithSupport(p,ch.member)||bannedAsSupport(p,ch.member))return false;
  return true;
}
// 빈 칸에 캐릭터를 넣고 파티 상태(멤버/직업/백사멸)를 갱신
function placeChar(p,ch){
  const free=p.slots.findIndex(s=>!s);
  if(free>=0)p.slots[free]=ch;else p.slots.push(ch);
  p.usedMember.add(ch.member);
  p.usedCls.add(ch.baseCls||cleanCls(ch.cls));
  if(isBsam(ch.cls,ch.baseCls))p.bsamCount++;
}
// 최소 인원 미달 파티 정리
// ① 미달 파티의 인원을 빈 칸이 있는 정상 파티로 옮기고
// ② 그래도 남은 인원끼리 다시 묶어 MIN_PARTY_SIZE 이상이면 파티로 살린다
// ③ 끝내 인원이 모자라면 배치하지 않는다 (칸반 '미배치 캐릭터'에 남는다)
function enforceMinPartySize(parties){
  const keep=parties.filter(p=>filledCount(p.slots)>=MIN_PARTY_SIZE);
  const orphans=parties.filter(p=>filledCount(p.slots)<MIN_PARTY_SIZE)
    .flatMap(p=>p.slots.filter(s=>s));
  if(!orphans.length)return keep;
  // ① 빈 칸이 있는 파티에 먼저 채워 넣는다 (많이 찬 파티부터 완성)
  const rest=[];
  orphans.forEach(ch=>{
    const tgt=keep.filter(p=>canAcceptChar(p,ch))
      .sort((a,b)=>filledCount(b.slots)-filledCount(a.slots))[0];
    if(tgt)placeChar(tgt,ch);else rest.push(ch);
  });
  // ② 남은 인원끼리 새 파티 구성
  let guard=0;
  while(rest.length&&guard++<50){
    const np=makeParty();
    placeChar(np,rest.shift());
    for(let i=0;i<rest.length&&filledCount(np.slots)<4;){
      if(canAcceptChar(np,rest[i]))placeChar(np,rest.splice(i,1)[0]);
      else i++;
    }
    if(filledCount(np.slots)>=MIN_PARTY_SIZE)keep.push(np); // ③ 미달이면 버린다
  }
  return keep;
}
function consolidateParties(parties){
  const canAccept=canAcceptChar;
  let moved=true,guard=0;
  while(moved&&guard++<50){
    moved=false;
    // 인원이 가장 적은 파티부터 해체를 시도
    const order=parties.map((p,i)=>({p,i,n:filledCount(p.slots)}))
      .filter(x=>x.n>0&&x.n<4).sort((a,b)=>a.n-b.n);
    for(const {p:src} of order){
      for(let si=0;si<src.slots.length;si++){
        const ch=src.slots[si];
        if(!ch)continue;
        // 빈 칸이 있는 다른 파티 중, 많이 찬 파티부터 채워 완성한다
        const targets=parties.filter(t=>t!==src&&filledCount(t.slots)<4&&canAccept(t,ch))
          .sort((a,b)=>filledCount(b.slots)-filledCount(a.slots));
        if(!targets.length)continue;
        const tgt=targets[0];
        src.slots[si]=null;
        placeChar(tgt,ch);
        moved=true;
      }
    }
  }
  // 빈 파티 제거 → 최소 인원 미달 파티 정리 → 슬롯 정규화
  return enforceMinPartySize(parties.filter(p=>filledCount(p.slots)>0))
    .map(p=>{p.slots=orderSlots(p.slots);return p;});
}
// A/B조 고정 편성 조건: 모든 A/B조 멤버의 최고bp 캐릭터가 완료되지 않아야 함
function isABGroupBroken(){
  const allAB=[...TEAM_A_SINGLE,...TEAM_A_MULTI,...TEAM_B_SINGLE,...TEAM_B_MULTI];
  return allAB.some(name=>{
    if(!selectedMembers.has(name)||!MEMBER_ORDER.includes(name))return false;
    // 완료 제외 전 전체 eligible 캐릭터 중 최고bp 캐릭터
    const m=MEMBERS_RAW.find(x=>x.name===name);
    if(!m)return false;
    const eligible=m.chars.filter(c=>charFits(c)).map((c,i)=>({...c,member:name,uid:name+"_"+i}));
    if(!eligible.length)return false;
    const topChar=eligible.reduce((a,b)=>b.bp>a.bp?b:a);
    return completedUids.has(topChar.uid);
  });
}

function buildParties(){
  if(!currentDiff||!MEMBERS_RAW.length)return;
  maxCharsPerMember={};
  MEMBER_ORDER.filter(n=>selectedMembers.has(n)).forEach(n=>{maxCharsPerMember[n]=getEligibleChars(n).length;});
  const used=new Set(),mCnt={};MEMBER_ORDER.forEach(n=>{mCnt[n]=0;});
  let allP=[];
  partialPartyCount=0;
  if(isEightManRaid()){
    // 8인 레이드: 4인 파티 2개가 한 공격대로 동시 입장.
    // 인원이 남으면 공격대를 반복 생성하고, 정원 미달이어도 공격대 단위를 유지한다
    allP=buildVelgardinParties(used,mCnt);
    partialPartyCount=allP.filter(p=>p.isPartial).length;
  } else if(currentDiff.topTier && !isABGroupBroken()){
    const p1=makeParty();
    tryAssignSupport(p1,[...TEAM_A_SINGLE,...TEAM_A_MULTI],used);
    for(const n of TEAM_A_SINGLE.filter(n=>selectedMembers.has(n)&&MEMBER_ORDER.includes(n)&&!p1.usedMember.has(n))){if(p1.slots.length>=4)break;const ch=pickDealer(n,p1,used,"highest");if(ch)addSlot(p1,ch,used);}
    for(const n of TEAM_A_MULTI.filter(n=>selectedMembers.has(n)&&MEMBER_ORDER.includes(n)&&!p1.usedMember.has(n))){if(p1.slots.length>=4)break;const ch=pickDealer(n,p1,used,"lowest");if(ch)addSlot(p1,ch,used);}
    sortP(p1);p1.slots.forEach(s=>{if(s)mCnt[s.member]=(mCnt[s.member]||0)+1;});
    const p2=makeParty();
    tryAssignSupport(p2,[...TEAM_B_SINGLE,...TEAM_B_MULTI],used);
    for(const n of TEAM_B_SINGLE.filter(n=>selectedMembers.has(n)&&MEMBER_ORDER.includes(n)&&!p2.usedMember.has(n))){if(p2.slots.length>=4)break;const ch=pickDealer(n,p2,used,"highest");if(ch)addSlot(p2,ch,used);}
    for(const n of TEAM_B_MULTI.filter(n=>selectedMembers.has(n)&&MEMBER_ORDER.includes(n)&&!p2.usedMember.has(n))){if(p2.slots.length>=4)break;const ch=pickDealer(n,p2,used,"lowest");if(ch)addSlot(p2,ch,used);}
    sortP(p2);p2.slots.forEach(s=>{if(s)mCnt[s.member]=(mCnt[s.member]||0)+1;});
    const extras=buildFreeParties(used,mCnt);
    const fixed=[p1,p2].filter(p=>filledCount(p.slots)>=MIN_PARTY_SIZE);
    allP=[...fixed,...extras];balanceParties(allP,fixed.length);
  } else {allP=buildFreeParties(used,mCnt);balanceParties(allP,0);}
  // 평균 전투력 기준이 있으면 미달 파티를 끌어올린 뒤 시작 시간순으로 정렬
  allParties=sortPartiesByStartTime(enforceMinAvgBp(allP.map(p=>p.slots),currentMinBp()));
  recalcCounts();
  updateRaidLabel();
  document.getElementById("partyCountLabel").textContent=allParties.length;
  renderParties();renderStats();
  document.getElementById("mainTabs").style.display="block";
  // 읽기 전용 URL에서는 저장이 불가능하므로 프리셋·완료 기록 카드를 숨긴다
  const ro=isReadOnlyUrl();
  document.getElementById("presetCard").style.display=ro?"none":"block";
  document.getElementById("completedCard").style.display=ro?"none":"block";
  loadPresets();
}
function updateRaidLabel(){
  const raidEmoji={"성심당":"⛪","세르카":"🧙","벨가르딘":"⚔️"};
  const raidName=document.getElementById("raidSel").value;
  const diffName=document.getElementById("diffSel").value;
  const diffClass={"노말":"diff-normal","1단계":"diff-normal","하드":"diff-hard","2단계":"diff-hard","나이트메어":"diff-nightmare","3단계":"diff-nightmare"}[diffName]||"diff-normal";
  const html=`<span style="font-weight:700">${raidEmoji[raidName]||""} ${raidName}</span> <span class="${diffClass}" style="font-weight:700">${diffName}</span>`;
  document.getElementById("raidLabel").innerHTML=html;
  document.getElementById("kanbanRaidLabel").innerHTML=html;
  const crl=document.getElementById("completedRaidLabel");
  if(crl) crl.textContent=`${raidEmoji[raidName]||""} ${raidName}`;

function recalcCounts(){
  // 수동 편집(드롭다운/드래그) 후에도 서포터가 마지막 자리를 유지하도록 정규화
  allParties=allParties.map(orderSlots);
  partyCounts={};MEMBERS_RAW.forEach(m=>{partyCounts[m.name]=0;});
  allParties.forEach(slots=>slots.forEach(s=>{if(s)partyCounts[s.member]=(partyCounts[s.member]||0)+1;}));
}
// 8인 레이드는 항상 공격대(파티 2개) 단위로 추가/삭제해야 짝이 깨지지 않는다
function addEmptyParty(){
  if(isEightManRaid()){
    allParties.push([null,null,null,null],[null,null,null,null]);
  } else allParties.push([null,null,null,null]);

function removeParty(pi){
  if(isEightManRaid()){
    const base=setIdxOf(pi)*2;
    if(!confirm(`${setIdxOf(pi)+1}공대(파티 2개)를 통째로 삭제할까요?`))return;
    allParties.splice(base,2);
  } else allParties.splice(pi,1);
  recalcCounts();document.getElementById("partyCountLabel").textContent=allParties.length;renderParties();renderStats();
}
function getSlotOptions(pi,si){
  const cur=allParties[pi][si];
  const otherUids=new Set();allParties.forEach((slots,pii)=>slots.forEach((s,sii)=>{if(s&&!(pii===pi&&sii===si))otherUids.add(s.uid);}));
  const sameMembers=new Set();allParties[pi].forEach((s,sii)=>{if(s&&sii!==si)sameMembers.add(s.member);});
  let pool=[];
  [...selectedMembers].forEach(name=>{getEligibleChars(name).forEach(c=>{if(otherUids.has(c.uid))return;if(sameMembers.has(c.member)&&!(cur&&c.uid===cur.uid))return;pool.push(c);});});
  if(cur)pool.push(cur);
  return pool.filter((c,i,a)=>a.findIndex(x=>x.uid===c.uid)===i).sort((a,b)=>b.bp-a.bp);
}
const avgBp=slots=>{const f=slots.filter(s=>s);return f.length?Math.round(f.reduce((s,c)=>s+c.bp,0)/f.length):0;};
function partyBadges(slots){
  const clsCnt={},memberCnt={};let bsamCnt=0;
  const hasSupp=slots.some(s=>s&&isSupport(s.cls));
  slots.filter(s=>s).forEach(s=>{const b=s.baseCls||cleanCls(s.cls);clsCnt[b]=(clsCnt[b]||0)+1;memberCnt[s.member]=(memberCnt[s.member]||0)+1;if(isBsam(s.cls,b))bsamCnt++;});
  const warns=[];
  if(Object.values(clsCnt).some(v=>v>1))warns.push("직업 중복");
  if(Object.values(memberCnt).some(v=>v>1))warns.push("멤버 중복");
  if(bsamCnt>2)warns.push("백사멸 3개+");
  // 시너지 중복 체크 (복수 소속 직업 포함, 어떤 시너지가 겹쳤는지 표기)
  const synGroups={};
  slots.filter(s=>s).forEach(s=>{
    const b=s.baseCls||cleanCls(s.cls);
    getSynergyGroups(s.cls,b).forEach(g=>{synGroups[g]=(synGroups[g]||0)+1;});
  });
  Object.entries(synGroups).filter(([,v])=>v>1)
    .forEach(([g])=>warns.push(`${SYNERGY_GROUPS[g].name} 중복`));
  // 궁합 금지 조합
  bannedPairsIn(slots).forEach(([sup,deal])=>warns.push(`${sup}서폿+${deal}딜러`));
  // 접속 시간은 편성 조건이 아니므로 경고하지 않는다 (파티 시작 시간 배지로만 표시)
  // 최소 평균 전투력 미달
  const cnt=slots.filter(s=>s).length;
  const minBp=currentMinBp();
  const lowBp=!!(minBp&&cnt>0&&avgBp(slots)<minBp);
  return{hasSupp,warns,bsamCnt,cnt,lowBp,minBp};
}

function makeCharCard(char,src){

}
function setupDrop(el,onDrop){
  el.addEventListener("dragover",e=>{e.preventDefault();el.classList.add("drag-over");});
  el.addEventListener("dragleave",e=>{if(!el.contains(e.relatedTarget))el.classList.remove("drag-over");});
  el.addEventListener("drop",e=>{e.preventDefault();e.stopPropagation();el.classList.remove("drag-over");onDrop();});
}

  const addBtn=document.createElement("button");addBtn.className="kanban-add-btn";
  addBtn.textContent=isEightManRaid()?"+ 공대 추가 (파티 2개)":"+ 파티 추가";
  addBtn.onclick=()=>{addEmptyParty();renderKanban();};
  partiesEl.appendChild(addBtn);
}
function kanbanAddParty(){addEmptyParty();renderKanban();}
function syncFromKanban(){renderParties();renderStats();switchTab("recommend");}

// ── 프리셋 ──
function getUrl(){return document.getElementById("sheetUrl").value.trim();}
function presetName(){const now=new Date();return `${now.getMonth()+1}/${now.getDate()} ${document.getElementById("raidSel").value} ${document.getElementById("diffSel").value}`;}
function showPresetStatus(msg,type){
  const el=document.getElementById("presetStatus");
  el.style.display="inline-block";el.textContent=msg;el.className="preset-status preset-status-"+type;
  setTimeout(()=>{el.style.display="none";},3000);
}
function savePreset(){
  if(!allParties.length){showPresetStatus("저장할 파티 구성이 없습니다.","err");return;}
  const name=presetName();
  // 레이드 컬럼은 RAIDS에서 파생 — 새 레이드 추가 시 여기를 고칠 필요가 없다
  const raidKeys=Object.keys(RAIDS);
  const partiesData=allParties.map(slots=>slots.map(slot=>{
    if(!slot)return null;
    const rec={member:slot.member,cls:slot.cls,baseCls:slot.baseCls||cleanCls(slot.cls),ilvl:slot.ilvl,bp:slot.bp,uid:slot.uid};
    raidKeys.forEach(k=>{rec[k]=slot[k]||"";});
    return rec;
  }));
  postAction({action:"savePreset",name,raid:document.getElementById("raidSel").value,diff:document.getElementById("diffSel").value,members:[...selectedMembers].join(","),parties:partiesData})
  .then(r=>r.json()).then(d=>{if(d.ok){showPresetStatus(`'${name}' 저장 완료`,"ok");loadPresets();}else showPresetStatus("저장 실패","err");})
  .catch(e=>showPresetStatus(e.message||"저장 실패: 네트워크 오류","err"));
}
function loadPresets(){
  // 읽기 전용 URL이면 프리셋 기능 자체를 숨긴다
  if(isReadOnlyUrl()){
    const card=document.getElementById("presetCard");
    if(card)card.style.display="none";
    return;
  }
  postAction({action:"loadPresets"})
  .then(r=>r.json()).then(data=>renderPresetList(data)).catch(()=>{});
}
function renderPresetList(presets){
  const list=document.getElementById("presetList");list.innerHTML="";
  if(!presets.length){list.innerHTML='<div class="preset-empty">저장된 프리셋이 없습니다.</div>';return;}
  [...presets].reverse().forEach(p=>{
    const item=document.createElement("div");item.className="preset-item";
    const left=document.createElement("div");left.className="preset-item-left";
    left.innerHTML=`<span class="preset-item-name">${p.name}</span><span class="preset-item-meta">${p.savedAt} · ${p.raid} ${p.diff}</span>`;
    const btns=document.createElement("div");btns.className="preset-item-btns";
    const lb=document.createElement("button");lb.className="btn btn-sm btn-primary";lb.textContent="불러오기";lb.onclick=()=>applyPreset(p);
    const db=document.createElement("button");db.className="btn btn-sm";db.textContent="삭제";db.style.cssText="color:var(--red);border-color:#F09595;";db.onclick=()=>deletePreset(p);
    btns.appendChild(lb);btns.appendChild(db);item.appendChild(left);item.appendChild(btns);list.appendChild(item);
  });
}
function applyPreset(p){
  // onRaidChange/onDiffChange 직접 호출 금지 → buildParties 실행 방지
  // 레이드 select 값만 세팅
  document.getElementById("raidSel").value=p.raid;
  // 난이도 옵션 수동 생성
  const diffSel=document.getElementById("diffSel");
  diffSel.innerHTML='<option value="">-- 난이도 --</option>';
  if(RAIDS[p.raid]){
    RAIDS[p.raid].forEach(d=>{
      const o=document.createElement("option");o.value=d.label;o.textContent=d.label;diffSel.appendChild(o);
    });
  }
  diffSel.value=p.diff;
  currentDiff=RAIDS[p.raid]?RAIDS[p.raid].find(d=>d.label===p.diff):null;
  const lr=document.getElementById("levelReq");
  if(currentDiff){lr.textContent=`아이템 레벨 ${currentDiff.minIlvl}+`;lr.style.display="inline-block";}
  renderMinBpInput();
  // 멤버 복원
  if(p.members){selectedMembers=new Set(p.members.split(",").map(s=>s.trim()).filter(Boolean));}
  else{selectedMembers=new Set(MEMBER_ORDER);}
  renderMembers();
  // 파티 직접 복원 (buildParties 실행 없음)
  // 구 프리셋은 벨가르딘/baseCls 필드가 없으므로 현재 시트 데이터에서 uid로 보강
  const byUid={};
  MEMBERS_RAW.forEach(m=>m.chars.forEach((c,i)=>{byUid[m.name+"_"+i]=c;}));
  allParties=p.parties.map(slots=>slots.map(slot=>{
    if(!slot)return null;
    const src=byUid[slot.uid]||{};
    const rec={...src,...slot};
    Object.keys(RAIDS).forEach(k=>{ if(rec[k]===undefined||rec[k]==="")rec[k]=src[k]||""; });
    rec.baseCls=rec.baseCls||cleanCls(rec.cls);
    return rec;
  }));
  recalcCounts();
  MEMBER_ORDER.filter(n=>selectedMembers.has(n)).forEach(n=>{maxCharsPerMember[n]=getEligibleChars(n).length;});
  document.getElementById("partyCountLabel").textContent=allParties.length;
  updateRaidLabel();
  document.getElementById("mainTabs").style.display="block";
  document.getElementById("completedCard").style.display="block";
  document.getElementById("presetCard").style.display="block";
  // 완료 데이터만 로드해서 완료된 슬롯 비우기 (buildParties 호출 없음)
  const weekKey=getWeekKey();
  document.getElementById('weekLabel').textContent=getWeekLabelStr();
  jsonpGet({action:'loadCompleted',weekKey,raid:p.raid}, data=>{
    completedUids=new Set(data.map(d=>d.uid));
    completedCharData=data;
    renderCompletedList(data);
    allParties.forEach((slots,pi)=>slots.forEach((s,si)=>{if(s&&completedUids.has(s.uid)){allParties[pi][si]=null;}}));
    recalcCounts();
    renderParties();renderStats();
  }, ()=>{renderParties();renderStats();});
  loadPresets();
  showPresetStatus(`'${p.name}' 불러오기 완료`,"ok");
}
function deletePreset(p){
  if(!confirm(`'${p.name}' 프리셋을 삭제할까요?`))return;
  postAction({action:"deletePreset",name:p.name,savedAt:p.savedAt})
  .then(r=>r.json()).then(()=>{showPresetStatus("삭제 완료","ok");loadPresets();}).catch(()=>showPresetStatus("삭제 실패","err"));
}

// ── 완료 기록 ──
let completedUids = new Set();
let completedCharData = [];

function getWeekKey() {
  // 매주 수요일 00:00 기준 주차 키
  const now = new Date();
  const day = now.getDay(); // 0=일,1=월,...,3=수
  const diff = (day >= 3) ? day - 3 : day + 4; // 이번 주 수요일까지의 차이
  const wed = new Date(now);
  wed.setDate(now.getDate() - diff);
  wed.setHours(0,0,0,0);
  return `${wed.getFullYear()}-${String(wed.getMonth()+1).padStart(2,'0')}-${String(wed.getDate()).padStart(2,'0')}`;
}

function getWeekLabelStr() {
  const key = getWeekKey();
  const wed = new Date(key);
  const sun = new Date(wed); sun.setDate(wed.getDate() + 6);
  const fmt = d => `${d.getMonth()+1}/${d.getDate()}`;
  return `${fmt(wed)} ~ ${fmt(sun)}`;
}

// 완료 데이터 먼저 불러온 후 파티 구성
function loadCompletedThenBuild() {
  const weekKey = getWeekKey();
  const raid = document.getElementById('raidSel').value;
  document.getElementById('weekLabel').textContent = getWeekLabelStr();
  jsonpGet({action:'loadCompleted', weekKey, raid}, data=>{
    completedUids = new Set(data.map(d=>d.uid));
    completedCharData = data;
    renderCompletedList(data);
    buildParties();
  }, ()=>buildParties());
}

function loadCompleted() {
  const weekKey = getWeekKey();
  const raid = document.getElementById('raidSel').value;
  document.getElementById('weekLabel').textContent = getWeekLabelStr();
  jsonpGet({action:'loadCompleted', weekKey, raid}, data=>{
    completedUids = new Set(data.map(d=>d.uid));
    completedCharData = data;
    renderCompletedList(data);
    renderParties();
    if(document.getElementById('tab-kanban').classList.contains('active')) renderKanban();
  });
}

function renderCompletedList(data) {
  const el = document.getElementById('completedList');
  if(!data.length) { el.innerHTML='<span style="font-size:12px;color:var(--text3);">완료된 캐릭터가 없습니다.</span>'; return; }
  el.innerHTML = '';
  data.forEach(d => {
    const pill = document.createElement('div');
    pill.className = 'stat-pill';
    pill.style.cssText = 'background:var(--teal-bg);border-color:var(--teal-border);';
    pill.innerHTML = `<span class="stat-name" style="color:var(--teal);">${d.member}</span><span class="stat-cur" style="color:var(--teal);">${d.cls}</span><span class="stat-max">${d.bp.toLocaleString()}</span>`;
    el.appendChild(pill);
  });
}

function toggleCompleted(slot, partyIdx, slotIdx) {
  const weekKey = getWeekKey();
  if (completedUids.has(slot.uid)) {
    // 완료 취소: 즉시 로컬 업데이트
    completedUids.delete(slot.uid);
    postAction({action:'removeCompleted', uid:slot.uid, weekKey}).catch(()=>{});
  } else {
    // 완료 처리: 즉시 로컬 업데이트
    completedUids.add(slot.uid);
    // 파티 슬롯에서 제거
    if(partyIdx !== undefined && slotIdx !== undefined) {
      allParties[partyIdx][slotIdx] = null;
      recalcCounts();
    }
    // 완료 현황에 즉시 추가
    completedCharData.push({uid:slot.uid, member:slot.member, cls:slot.cls, bp:slot.bp});
    // 시트에 비동기 저장
    const rec = {uid:slot.uid, member:slot.member, cls:slot.cls, bp:slot.bp,
      raid:document.getElementById('raidSel').value,
      diff:document.getElementById('diffSel').value, weekKey};
    // raid는 이미 포함됨
    postAction({action:'saveCompleted', records:[rec]}).catch(()=>{});
  }
  // 즉시 UI 갱신
  renderCompletedList(completedCharData);
  renderParties();
  renderStats();
  document.getElementById('partyCountLabel').textContent = allParties.length;
}

function resetWeek() {
  const raid = document.getElementById('raidSel').value;
  if(!confirm(`${raid} 이번 주 완료 기록을 전부 초기화할까요?`)) return;
  const weekKey = getWeekKey();
  const uids = [...completedUids];
  // 즉시 로컬 초기화
  completedUids = new Set();
  completedCharData = [];
  renderCompletedList([]);
  renderParties();
  renderStats();
  // 시트에서 비동기 삭제
  uids.forEach(uid => postAction({action:'removeCompleted', uid, weekKey}).catch(()=>{}));
}

// ── 텍스트 출력 ──
// ── 파티 블록 드래그 순서 변경 ──
let dragPartyIdx = null;
let dragPartyType = null; // 'recommend' | 'kanban'

function setupPartyDrag(el, idx, type){
  el.draggable = true;
  el.addEventListener('dragstart', e=>{
    dragPartyIdx = idx;
    dragPartyType = type;
    el.classList.add('dragging-party');
    e.dataTransfer.effectAllowed = 'move';
  });
  el.addEventListener('dragend', ()=>el.classList.remove('dragging-party'));
  el.addEventListener('dragover', e=>{
    e.preventDefault();
    if(dragPartyIdx !== null && dragPartyIdx !== idx && dragPartyType === type)
      el.classList.add('drag-over-party');
  });
  el.addEventListener('dragleave', ()=>el.classList.remove('drag-over-party'));
  el.addEventListener('drop', e=>{
    e.preventDefault();
    el.classList.remove('drag-over-party');
    if(dragPartyIdx === null || dragPartyIdx === idx || dragPartyType !== type) return;
    if(isEightManRaid()){
      // 8인 레이드는 공격대(파티 2개) 단위로 교환해야 짝이 깨지지 않는다
      const a = setIdxOf(dragPartyIdx)*2, b = setIdxOf(idx)*2;
      if(a === b){ dragPartyIdx = null; return; }
      const setA = allParties.slice(a, a+2), setB = allParties.slice(b, b+2);
      allParties.splice(a, 2, ...setB);
      allParties.splice(b, 2, ...setA);
    } else {
      // 순서 교환
      const tmp = allParties[dragPartyIdx];
      allParties[dragPartyIdx] = allParties[idx];
      allParties[idx] = tmp;
    }
    recalcCounts();
    document.getElementById('partyCountLabel').textContent = allParties.length;
    if(type === 'recommend'){ renderParties(); renderStats(); }
    else { renderKanban(); renderParties(); renderStats(); }
    dragPartyIdx = null;
  });
}

function exportText(){
  const raidName = document.getElementById('raidSel').value;
  const diffName = document.getElementById('diffSel').value;
  const prefix = `**${raidName} ${diffName}**`;
  const divider = '='.repeat(69);
  const lines = allParties.map((slots,pi)=>{
    const members = slots.filter(s=>s).map(s=>`${s.member}-${s.cls}`).join(', ');
    // 8인 레이드는 어느 공격대의 몇 번째 파티인지 표기
    const tag = isEightManRaid() ? ` [${setIdxOf(pi)+1}공대-${pi%2+1}]` : '';
    return `${prefix}${tag} : ${members}`;
  });
  const text = `## ${raidName} ${diffName}\n` + lines.join('\n') + '\n' + divider;
  const box = document.getElementById('exportBox');
  box.textContent = text;
  box.style.display = 'block';
  document.getElementById('copyBtn').style.display = 'inline-block';
}
// 상세 리포트: 파티별 구성 + 총/평균 전투력 + 시너지 요약 + 미배치 목록
function exportReport(){
  const raidName = document.getElementById('raidSel').value;
  const diffName = document.getElementById('diffSel').value;
  const out = [`## ${raidName} ${diffName}`, ''];
  allParties.forEach((slots,pi)=>{
    if(isEightManRaid() && pi%2===0){
      const tot=setFilledCount(pi);
      out.push(`━━ ${setIdxOf(pi)+1}공대 (8인 동시 입장) — ${tot}/8 ${tot===8?'입장 가능':'인원 미달'} ━━`);
    }
    const f = slots.filter(s=>s);
    const total = f.reduce((s,c)=>s+c.bp,0);
    const avg = f.length ? Math.round(total/f.length) : 0;
    out.push(isEightManRaid()?`[${setLabelOf(pi)}]`:`[파티 ${pi+1}]`);
    // 슬롯은 이미 딜러→서포터 순으로 정규화되어 있음
    slots.forEach((s,si)=>{
      const isLast = si===slots.length-1;
      const role = s ? (isSupport(s.cls,s.baseCls)?'서포터':`딜러${si+1}`) : (isLast?'서포터':`딜러${si+1}`);
      out.push(s ? `  ${role.padEnd(6)} ${s.member} · ${s.cls} · ${s.bp.toLocaleString()}`
                 : `  ${role.padEnd(6)} (비어 있음)`);
    });
    out.push(`  총 전투력 ${total.toLocaleString()} · 평균 ${avg.toLocaleString()}`);
    const st=partyStartLabel(slots);
    if(st)out.push(`  시작 시간: ${st} (가장 늦은 사람 기준)`);
    // 시너지 구성
    const syn={};
    f.forEach(s=>getSynergyGroups(s.cls,s.baseCls||cleanCls(s.cls))
      .forEach(g=>{syn[g]=(syn[g]||0)+1;}));
    const synTxt=Object.entries(syn)
      .map(([g,v])=>`${SYNERGY_GROUPS[g].name}${v>1?`×${v}`:''}`).join(', ');
    out.push(`  시너지: ${synTxt||'없음'}`);
    const {warns, lowBp, minBp} = partyBadges(slots);
    const allWarns = lowBp ? [`평균 전투력 ${minBp.toLocaleString()} 미달`, ...warns] : warns;
    if(allWarns.length) out.push(`  ⚠ ${allWarns.join(', ')}`);
    out.push('');
  });
  // 미배치 캐릭터
  const pool = getPoolChars().sort((a,b)=>{
    const sa=isSupport(a.cls,a.baseCls)?0:1, sb=isSupport(b.cls,b.baseCls)?0:1;
    return sa-sb || b.bp-a.bp;
  });
  out.push(`── 미배치 캐릭터 (${pool.length}캐) ──`);
  if(!pool.length) out.push('  없음');
  else pool.forEach(c=>{
    const t=TIME_OPTIONS.find(o=>o.value===memberStartTime[c.member]);
    out.push(`  ${isSupport(c.cls,c.baseCls)?'서포터':'딜러  '} ${c.member} · ${c.cls} · ${t?t.label:'—'} · ${c.ilvl.toLocaleString()} · ${c.bp.toLocaleString()}`);
  });
  const box = document.getElementById('exportBox');
  box.textContent = out.join('\n');
  box.style.display = 'block';
  document.getElementById('copyBtn').style.display = 'inline-block';
}
function copyExport(){
  const text = document.getElementById('exportBox').textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const btn = document.getElementById('copyBtn');
    const orig = btn.textContent;
    btn.textContent = '복사됨!';
    btn.style.color = 'var(--teal)';
    setTimeout(()=>{ btn.textContent = orig; btn.style.color = ''; }, 1500);
  }).catch(()=>{
    // clipboard API 실패 시 선택 방식으로 fallback
    const box = document.getElementById('exportBox');
    const range = document.createRange();
    range.selectNode(box);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
  });
}
